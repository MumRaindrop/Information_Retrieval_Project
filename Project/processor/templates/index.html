<!--Simple HTML Web UI for the Information Retrieval System-->
<!DOCTYPE html>
<html>
<head>
    <title>IR System Control Panel</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        h2 { margin-top: 40px; }
        .section { border: 1px solid #ccc; padding: 20px; border-radius: 5px; margin-bottom: 30px; }
        input[type=text], input[type=number] {
            width: 300px;
            padding: 6px;
        }
        textarea { width: 100%; height: 150px; }
        button { padding: 8px 15px; }
        pre { background: #f3f3f3; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>

<h1>Information Retrieval System</h1>

<div class="section">
    <h2>Crawl Web Pages</h2>

    <label>Seed URL:</label><br>
    <input id="seed" type="text" placeholder="https://example.com"><br><br>

    <label>Max Pages:</label><br>
    <input id="max_pages" type="number" value="10" min="1"><br><br>

    <label>Max Depth:</label><br>
    <input id="max_depth" type="number" value="2" min="1"><br><br>

    <button onclick="startCrawl()">Start Crawl</button>

    <h3>Crawl Output:</h3>
    <pre id="crawl_output"></pre>
</div>

<div class="section">
    <h2>Build Inverted Index</h2>
    <button onclick="buildIndex()">Build Index</button>

    <h3>Status:</h3>
    <pre id="index_status"></pre>
</div>

<div class="section">
    <h2>Query Search</h2>

    <input id="query_text" type="text" placeholder="Enter query text">
    <button onclick="runQuery()">Search</button>

    <h3>Query Results:</h3>
    <pre id="query_output"></pre>
</div>

<div class="section">
    <h2>Batch Queries (CSV Upload)</h2>

    <form id="form_csv" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <button type="submit">Submit CSV</button>
    </form>

    <pre id="csv_output"></pre>
</div>

<script>
async function startCrawl() {
    let res = await fetch("/crawl", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            seed: document.getElementById("seed").value,
            max_pages: parseInt(document.getElementById("max_pages").value),
            max_depth: parseInt(document.getElementById("max_depth").value)
        })
    });

    document.getElementById("crawl_output").textContent =
        JSON.stringify(await res.json(), null, 2);
}

async function buildIndex() {
    let res = await fetch("/build_index", { method: "POST" });
    document.getElementById("index_status").textContent =
        JSON.stringify(await res.json(), null, 2);
}

async function runQuery() {
    let query = document.getElementById("query_text").value;

    let res = await fetch("/query_text", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
    });

    document.getElementById("query_output").textContent =
        JSON.stringify(await res.json(), null, 2);
}

document.getElementById("form_csv").onsubmit = async (e) => {
    e.preventDefault();

    let formData = new FormData();
    formData.append("file", e.target.file.files[0]);

    let res = await fetch("/query", { method: "POST", body: formData });

    document.getElementById("csv_output").textContent =
        JSON.stringify(await res.json(), null, 2);
};
</script>

</body>
</html>
